<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Local Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Animated Background Elements -->
  <div class="background-mesh">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Glassy Navbar -->
  <nav class="glass-nav">
    <div class="nav-content">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>Market</span>
      </div>
      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search items...">
      </div>
      <div class="auth-controls" id="authControls">
        <!-- Will be populated by JS -->
      </div>
    </div>
  </nav>

  <main class="container">
    <header class="page-header">
      <h1 class="glass-text">Discover</h1>
      <p class="glass-text-sub" id="greetingText">Find the best local items around you.</p>
    </header>

    <div class="filter-controls" id="filterControls" style="display: none;">
      <select id="sortSelect" class="glass-select">
        <option value="default">Default Sorting</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name-asc">Name: A to Z</option>
        <option value="name-desc">Name: Z to A</option>
        <option value="top-3-cheapest">Top 3 Cheapest</option>
      </select>
    </div>

    <div class="product-grid" id="productGrid">
      <div class="loader">
        <div class="spinner"></div>
      </div>
    </div>
  </main>

  <!-- Glass Details Modal -->
  <div class="modal-overlay" id="detailsModal">
    <div class="modal-content glass-card">
      <button class="close-btn" id="closeDetailsModal">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <div class="modal-body">
        <div class="modal-image-placeholder">
          <svg class="modal-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        </div>
        <div class="modal-info">
          <div class="modal-category" id="modalCategory">Category</div>
          <h2 id="modalTitle">Product Name</h2>
          <div class="modal-price" id="modalPrice">$0.00</div>
          
          <div class="modal-section">
            <h3>Description</h3>
            <p class="modal-desc" id="modalDesc">Product description will appear here.</p>
          </div>
          
          <div class="modal-meta">
            <div class="meta-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <span id="modalSeller">Seller</span>
            </div>
          </div>
          
          <div class="modal-actions" id="modalActions">
            <button class="buy-btn">Message Seller</button>
            <!-- Admin actions will be injected here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Auth Modal (Login/Signup) -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-content glass-card small-modal">
      <button class="close-btn" id="closeAuthModal">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <h2 id="authTitle" style="margin-bottom: 1.5rem;">Login</h2>
      <form id="authForm">
        <div class="form-group" id="nameGroup" style="display: none;">
          <label>Name</label>
          <input type="text" id="authName" placeholder="Your name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="authEmail" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="authPassword" required placeholder="••••••••">
        </div>
        <div class="form-group" id="passwordConfirmGroup" style="display: none;">
          <label>Confirm Password</label>
          <input type="password" id="authPasswordConfirm" placeholder="••••••••">
        </div>
        <button type="submit" class="buy-btn" style="width: 100%; margin-top: 1rem;" id="authSubmitBtn">Login</button>
      </form>
      <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
        <span id="authToggleText">Don't have an account?</span> 
        <a href="#" id="authToggleLink" style="color: var(--accent); text-decoration: none; font-weight: 600;">Sign up</a>
      </p>
    </div>
  </div>

  <!-- Product Form Modal (Create/Edit) -->
  <div class="modal-overlay" id="productFormModal">
    <div class="modal-content glass-card small-modal">
      <button class="close-btn" id="closeProductFormModal">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <h2 id="productFormTitle" style="margin-bottom: 1.5rem;">Add Product</h2>
      <form id="productForm">
        <input type="hidden" id="productId">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="prodName" required placeholder="Product Name">
        </div>
        <div class="form-group">
          <label>Price ($)</label>
          <input type="number" id="prodPrice" required placeholder="0.00" step="0.01">
        </div>
        <div class="form-group">
          <label>Category</label>
          <input type="text" id="prodCategory" required placeholder="e.g. Electronics, Furniture">
        </div>
        <div class="form-group">
          <label>Seller Name</label>
          <input type="text" id="prodSeller" required placeholder="Your shop name">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="prodDesc" rows="3" placeholder="Brief description (max 50 chars)" maxlength="50"></textarea>
        </div>
        <button type="submit" class="buy-btn" style="width: 100%; margin-top: 1rem;" id="productSubmitBtn">Save Product</button>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">Message</div>

  <script src="script.js"></script>
</body>
</html>
